name: CI failure diagnosis

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 要诊断的 GitHub Actions run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    name: Generate read-only failure diagnosis
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["failure","timed_out","action_required","startup_failure","cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Diagnose exact workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          mkdir -p artifacts/ci-failure-diagnosis
          node scripts/diagnose-ci-failure.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --run "$TARGET_RUN_ID" \
            --json > artifacts/ci-failure-diagnosis/report.json

      - name: Upload diagnosis artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnosis-${{ github.run_id }}
          path: artifacts/ci-failure-diagnosis/report.json
          if-no-files-found: error
          retention-days: 14
