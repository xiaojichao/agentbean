name: Weekly SDLC flow metrics

on:
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 观察窗口天数
        required: true
        default: '28'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  report:
    name: Generate read-only SDLC flow metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Generate metrics artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || '28' }}
        run: |
          mkdir -p artifacts/sdlc-flow-metrics
          node scripts/report-sdlc-flow-metrics.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --days "$REPORT_DAYS" \
            --json > artifacts/sdlc-flow-metrics/report.json

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-flow-metrics-${{ github.run_id }}
          path: artifacts/sdlc-flow-metrics/report.json
          if-no-files-found: error
          retention-days: 28
